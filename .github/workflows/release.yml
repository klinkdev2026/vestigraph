name: Release

# Tag-triggered PyPI publish for Vestigraph. Push a tag like `v0.2.0`
# after a green main, or run manually with target=none/testpypi.
#
# PyPI Trusted Publishing setup:
#   owner/repo: klinkdev2026/vestigraph
#   workflow: release.yml
#   projects:
#     vestigraph
#     vestigraph-scan-core
#   environments:
#     TestPyPI -> testpypi-vestigraph, testpypi-vestigraph-scan-core
#     PyPI     -> pypi-vestigraph, pypi-vestigraph-scan-core

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Manual run target: 'none' = build + smoke only; 'testpypi' = upload to TestPyPI."
        type: choice
        options: [none, testpypi]
        default: none

permissions:
  contents: read

concurrency:
  group: vestigraph-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  public-ci:
    name: public package CI for this commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version-check:
    name: version and tag check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check package metadata and tag
        shell: bash
        run: |
          python - <<'PY'
          import os, runpy, tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          project = pyproject['project']
          version = project['version']
          if project['name'] != 'vestigraph':
              raise SystemExit(f"unexpected project name: {project['name']}")
          init_version = runpy.run_path('vestigraph/__init__.py').get('__version__')
          if init_version != version:
              raise SystemExit(f"vestigraph.__version__ {init_version!r} != pyproject {version!r}")
          native_project = tomllib.loads(Path('native/scan_core/pyproject.toml').read_text(encoding='utf-8'))['project']
          if native_project['name'] != 'vestigraph-scan-core':
              raise SystemExit(f"unexpected native project name: {native_project['name']}")
          if native_project['version'] != version:
              raise SystemExit(f"native version {native_project['version']!r} != vestigraph {version!r}")
          ref = os.environ.get('GITHUB_REF', '')
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          if event == 'push' and ref.startswith('refs/tags/'):
              tag = ref.rsplit('/', 1)[-1]
              if tag != f'v{version}':
                  raise SystemExit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"vestigraph {version}")
          PY

  native-sdist:
    name: native source distribution
    needs: [public-ci, version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build native sdist
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.14,<2'
          maturin sdist --manifest-path native/scan_core/Cargo.toml --out native-dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-native-sdist
          path: native-dist/*

  build-dist:
    name: build Vestigraph wheel and sdist
    needs: [public-ci, version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and check distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          rm -rf build vestigraph.egg-info
          python -B tools/audit_public_artifacts.py --root . --dist-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-vestigraph
          path: dist/*

  audit-dist:
    name: audit combined distributions
    needs: [build-dist, native-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-vestigraph
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: native-wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dist-native-sdist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit source tree and all distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          python -m twine check dist/*
          python -B tools/audit_public_artifacts.py --root . --dist-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-native
          path: |
            dist/vestigraph_scan_core-*
            dist/vestigraph-scan-core-*

  install-smoke:
    name: install smoke ${{ matrix.os }} py${{ matrix.python }}
    needs: [build-dist, audit-dist]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-vestigraph
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-native
          path: dist
      - name: Install built Vestigraph with required native scan core and run smoke checks
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links dist dist/vestigraph-*.whl
          python -m pip check
          python - <<'PY'
          import importlib.resources as resources
          import vestigraph
          import vestigraph.web.app
          import vestigraph_scan_core
          import klink
          from vestigraph.vesti_formats.vesti_format_gds import native as scan_backend
          assert resources.files('vestigraph.web').joinpath('static/index.html').is_file()
          cap = scan_backend.capability()
          assert cap["available"], cap
          assert scan_backend.select_backend("auto")[0] == "rust"
          print('vestigraph install smoke ok', vestigraph.__version__, vestigraph_scan_core.__name__, klink.__name__)
          PY
          python -I tools/check_installed.py

  publish-testpypi-native:
    name: publish vestigraph-scan-core to TestPyPI
    needs: [public-ci, version-check, build-dist, native-sdist, audit-dist, install-smoke]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment: testpypi-vestigraph-scan-core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-native
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/

  publish-testpypi-vestigraph:
    name: publish vestigraph to TestPyPI
    needs: [publish-testpypi-native]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment: testpypi-vestigraph
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-vestigraph
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/

  publish-native:
    name: publish vestigraph-scan-core to PyPI
    needs: [public-ci, version-check, build-dist, native-sdist, audit-dist, install-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi-vestigraph-scan-core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-native
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-vestigraph:
    name: publish vestigraph to PyPI
    needs: [publish-native]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi-vestigraph
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-vestigraph
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

