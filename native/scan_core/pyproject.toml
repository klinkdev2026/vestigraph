[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "vestigraph-scan-core"
version = "0.2.2"
requires-python = ">=3.10"
description = "Bounded Rust backend for Vestigraph GDS scanning, installed with Vestigraph by default."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "klink developers"}]

[project.urls]
Homepage = "https://github.com/klinkdev2026/vestigraph"
Repository = "https://github.com/klinkdev2026/vestigraph"

[tool.maturin]
module-name = "vestigraph_scan_core"
features = ["pyo3/extension-module"]
# Exclude host-specific build metadata from public wheels.
[tool.maturin.sbom]
rust = false
auditwheel = false
